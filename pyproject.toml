[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sweeper-v2"
version = "0.5.0"
description = "Sweeper V2: resumable bulk acquisition with breathing heavy, medium, and light modes"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Christian Cassarly"}]
keywords = ["archives", "datasets", "harvesting", "research", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.scripts]
sweeper = "sweeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
